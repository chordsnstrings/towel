name: Verify towel desk
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: move
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: move_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify against PostgreSQL
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://move:ci-test-password@localhost:5432/move_test
      - run: npm run build:netlify
      - run: npm run test:netlify-bundle
      - run: npm audit --omit=dev --audit-level=high
      - name: Build production image
        run: docker build -t move-towel-desk:ci .
